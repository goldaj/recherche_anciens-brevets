name: Recherche - verification minimale
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester le modele et les hypotheses
        run: python -m unittest discover -s tests -v
      - name: Reproduire le CSV
        run: python etudes/flettner/rotor_model.py --out /tmp/sensibilite_rotor.csv
      - name: Contrôler les références et l'index
        run: python tools/check_repository.py
      - name: Exercices supplémentaires de validation numérique
        run: |
          python etudes/eau_atmospherique/gravity_budget.py --head-m 200 --liters-per-day 10 --efficiency 0.6 --fan-w 1.0
          python etudes/dessalement_vagues/ro_pressure_budget.py --pressure-psi 800 --recovery 0.4 --pump-efficiency 0.85
      - name: Reproduire les calculs hybrides
        run: python -m etudes.combinaisons.hybrid_budgets --out /tmp/assemblages_scenarios.csv
